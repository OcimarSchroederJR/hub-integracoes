name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint:ci
      - run: npm test -- --ci
      - run: npm run build
      - run: npm run test:e2e
        env:
          PARCEIRO_ALFA_TOKEN: token-de-ci
          JWT_SECRET: segredo-de-ci-com-mais-de-16-caracteres

  docker-build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hub
          MYSQL_USER: hub
          MYSQL_PASSWORD: hub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: mysql://hub:hub@localhost:3306/hub

      - run: docker build -t hub-integracoes:ci .

      - name: Sobe o container e testa /health de verdade
        run: |
          docker run -d --name hub --network host \
            -e APP_PORT=3000 \
            -e DATABASE_URL=mysql://hub:hub@localhost:3306/hub \
            -e REDIS_HOST=localhost \
            -e REDIS_PORT=6379 \
            -e PARCEIRO_ALFA_BASE_URL=http://localhost:4000 \
            -e PARCEIRO_ALFA_TOKEN=token-de-ci \
            -e PARCEIRO_BETA_CSV_URL=http://localhost:4000/beta/carteira.csv \
            -e PARCEIRO_BETA_WEBHOOK_URL=http://localhost:4000/beta/webhook \
            -e JWT_SECRET=segredo-de-ci-com-mais-de-16-caracteres \
            hub-integracoes:ci

          # Os passos do GitHub Actions rodam com "bash -e": o proprio exit
          # code do curl (7 = conexao recusada) aborta o script inteiro na
          # primeira tentativa, antes do loop sequer chegar no "if" -- por
          # isso o "|| true", so para nao propagar esse exit code. curl com
          # -w ja imprime "000" no lugar do http_code quando a conexao
          # falha, entao $codigo continua utilizavel mesmo nesse caso.
          for i in $(seq 1 20); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
            if [ "$codigo" = "200" ] || [ "$codigo" = "503" ]; then
              echo "Container respondeu em /health com HTTP $codigo (S3/DynamoDB não disponíveis neste job, 503 é esperado)"
              exit 0
            fi
            sleep 2
          done

          echo "Container nao respondeu em /health"
          docker logs hub
          exit 1

      - name: Logs do container
        if: always()
        run: docker logs hub || true

  mock-parceiros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mock-parceiros/package-lock.json

      - run: npm ci
        working-directory: mock-parceiros
      - run: npx tsc --noEmit
        working-directory: mock-parceiros
      - run: npm run build
        working-directory: mock-parceiros

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci
        working-directory: cli
      - run: npx tsc --noEmit
        working-directory: cli
      - run: npm run build
        working-directory: cli

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
