services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hub
      MYSQL_USER: hub
      MYSQL_PASSWORD: hub
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-parceiros:
    build:
      context: ./mock-parceiros
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      ALFA_TAMANHO_CARTEIRA: ${ALFA_TAMANHO_CARTEIRA:-500}
      ALFA_SIMULAR_FALHAS: ${ALFA_SIMULAR_FALHAS:-true}
      ALFA_RATE_LIMIT_POR_MINUTO: ${ALFA_RATE_LIMIT_POR_MINUTO:-60}
      ALFA_PROBABILIDADE_FALHA_500: ${ALFA_PROBABILIDADE_FALHA_500:-0.05}
      BETA_TAMANHO_CARTEIRA: ${BETA_TAMANHO_CARTEIRA:-200}

  localstack:
    image: localstack/localstack:3
    restart: unless-stopped
    ports:
      - "${LOCALSTACK_HOST_PORT:-4566}:4566"
    environment:
      SERVICES: s3,dynamodb
      DEFAULT_REGION: us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql_data:
  localstack_data:
  prometheus_data:
  grafana_data:
